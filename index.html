    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif}
        :root{
            --primario:#1565C0;--primario-escuro:#0D47A1;--primario-claro:#42A5F5;
            --secundario:#E65100;--secundario-claro:#FF9100;--destaque:#FFC107;
            --sucesso:#2E7D32;--alerta:#F57C00;--erro:#C62828;
            --fundo:#F8FAFC;--texto:#1E293B;--texto-claro:#64748B;--borda:#E2E8F0;
            --sombra:0 2px 12px rgba(0,0,0,.06);--sombra-forte:0 12px 40px rgba(21,101,192,.18);
            --sombra-laranja:0 8px 30px rgba(230,81,0,.25)
        }
        html{scroll-behavior:smooth}
        body{background:var(--fundo);color:var(--texto);line-height:1.6;overflow-x:hidden}
        a{text-decoration:none;color:inherit}
        
        .barra-emergencia{background:linear-gradient(90deg,#C0392B,#E74C3C);color:white;text-align:center;padding:.8rem 1rem;font-weight:700;font-size:.95rem;position:sticky;top:0;z-index:10000;box-shadow:0 2px 10px rgba(192,57,43,.3);animation:pulsar-bg 2s infinite}
        @keyframes pulsar-bg{0%,100%{box-shadow:0 2px 10px rgba(192,57,43,.3)}50%{box-shadow:0 2px 20px rgba(192,57,43,.5)}}
        .barra-emergencia a{color:var(--destaque);font-weight:700}
        
        .barra-topo{background:var(--primario-escuro);color:white;font-size:.85rem;padding:.6rem 1rem;text-align:center}
        .barra-topo a{color:var(--destaque);font-weight:600}
        
        .aviso-instalar{background:linear-gradient(135deg,#E8F5E9,#A5D6A7);color:#1B5E20;padding:1rem 1.5rem;border-radius:14px;text-align:center;margin:0 1rem 2rem;font-weight:600;display:none;animation:deslizar-baixo .5s ease-out}
        .aviso-instalar.mostrar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
        .btn-instalar{background:var(--sucesso);color:white;border:none;padding:.7rem 1.5rem;border-radius:50px;font-weight:700;cursor:pointer;transition:.3s}
        .btn-instalar:hover{background:#1B5E20;transform:scale(1.05)}
        .btn-fechar-aviso{background:none;border:none;color:#1B5E20;font-size:1.2rem;cursor:pointer;padding:0 .5rem}
        
        nav{background:#fff;position:sticky;top:0;width:100%;z-index:9999;box-shadow:var(--sombra)}
        .nav-container{max-width:1200px;margin:0 auto;padding:0 1rem;display:flex;justify-content:space-between;align-items:center;height:70px}
        .logo{font-size:1.2rem;font-weight:800;display:flex;align-items:center;gap:.4rem}
        .logo-azul{color:var(--primario)}
        .logo-laranja{color:var(--secundario)}
        .menu-btn{display:none;background:none;border:none;font-size:1.8rem;color:var(--primario);cursor:pointer;padding:.5rem}
        .nav-links{display:flex;gap:.5rem;list-style:none;font-weight:600;font-size:.95rem;align-items:center}
        .nav-links a{color:var(--texto);padding:.6rem .8rem;border-radius:8px;transition:.25s}
        .nav-links a:hover,.nav-links a.ativo{color:var(--primario);background:rgba(21,101,192,.08)}
        .btn-nav{background:linear-gradient(90deg,var(--primario),var(--primario-claro));color:#fff!important;padding:.7rem 1.4rem!important;border-radius:50px;margin-left:.5rem;box-shadow:0 4px 12px rgba(21,101,192,.25);transition:.3s}
        .btn-nav:hover{background:linear-gradient(90deg,var(--secundario),var(--secundario-claro));transform:translateY(-2px);box-shadow:var(--sombra-laranja)}
        .oculto{display:none!important}
        
        section{max-width:1200px;margin:0 auto;padding:4rem 1.2rem}
        .secao-titulo{text-align:center;margin-bottom:3rem}
        .secao-titulo h2{font-size:2.1rem;color:var(--primario);margin-bottom:.8rem}
        .linha{width:70px;height:5px;background:linear-gradient(90deg,var(--primario),var(--secundario));margin:0 auto;border-radius:3px}
        .subtitulo{color:var(--texto-claro);margin-top:1rem;font-size:1.05rem;max-width:600px;margin-left:auto;margin-right:auto;line-height:1.7}
        
        .destaque-orcamento{background:linear-gradient(135deg,#FFF8E1,#FFD95A);color:#854D0E;padding:1.5rem;border-radius:16px;text-align:center;font-weight:700;margin:2rem 0;box-shadow:0 6px 20px rgba(255,193,7,.25);animation:brilho 3s infinite alternate}
        @keyframes brilho{from{box-shadow:0 6px 20px rgba(255,193,7,.25)}to{box-shadow:0 6px 30px rgba(255,193,7,.4)}}
        
        #inicio{background:linear-gradient(135deg,#0D47A1 0%,#1976D2 50%,#FF6D00 100%);min-height:92vh;display:flex;align-items:center;margin-top:0;color:white;position:relative;overflow:hidden}
        #inicio::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");opacity:.5}
        .hero-conteudo{max-width:700px;margin:0 auto;text-align:center;position:relative;z-index:1;animation:deslizar-baixo .8s ease-out}
        @keyframes deslizar-baixo{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
        .hero-conteudo h1{font-size:2.2rem;line-height:1.3;margin-bottom:1.5rem;text-shadow:0 2px 10px rgba(0,0,0,.15)}
        .hero-conteudo h1 span{color:var(--destaque);display:inline-block;animation:pulsar-texto 2s infinite}
        @keyframes pulsar-texto{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
        .hero-conteudo p{font-size:1.1rem;margin-bottom:1rem;opacity:.95;max-width:550px;margin-left:auto;margin-right:auto}
        .hero-botoes{display:flex;gap:1.2rem;flex-wrap:wrap;justify-content:center;margin:2.5rem 0}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:1.1rem 2.2rem;border-radius:50px;font-weight:700;font-size:1rem;border:none;cursor:pointer;transition:.3s;min-width:200px}
        .btn:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.25)}
        .btn-principal{background:linear-gradient(90deg,#FF6D00,#FF9100);color:white;box-shadow:var(--sombra-laranja)}
        .btn-principal:hover{background:linear-gradient(90deg,#E65100,#FF6D00)}
        .btn-branco{background:white;color:var(--primario);box-shadow:0 6px 20px rgba(0,0,0,.1)}
        .btn-branco:hover{background:#FFF8E1;color:var(--secundario)}
        
        .selos{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;max-width:550px;margin:0 auto}
        .selo{background:rgba(255,255,255,.15);backdrop-filter:blur(10px);padding:1.2rem 1rem;border-radius:14px;transition:.3s;border:1px solid rgba(255,255,255,.2)}
        .selo:hover{transform:translateY(-8px);background:rgba(255,255,255,.25)}
        .selo-icone{font-size:1.8rem;margin-bottom:.5rem}
        .selo-nome{font-weight:700;font-size:.9rem}
        
        .servicos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2rem}
        .servico-card{background:white;padding:2.2rem;border-radius:20px;box-shadow:var(--sombra);border-top:5px solid var(--primario);transition:.4s;position:relative;overflow:hidden}
        .servico-card::before{content:'';position:absolute;top:0;right:0;width:100px;height:100px;background:linear-gradient(135deg,rgba(21,101,192,.05),transparent);border-radius:0 0 0 100%}
        .servico-card:hover{transform:translateY(-10px);box-shadow:var(--sombra-forte);border-top-color:var(--secundario)}
        .servico-icone{font-size:2.2rem;margin-bottom:1rem}
        .servico-card h3{color:var(--primario);margin-bottom:1.2rem;font-size:1.3rem}
        .servico-detalhes{margin-top:1rem;font-size:.95rem;color:var(--texto-claro)}
        .servico-detalhes li{list-style:none;padding:.5rem 0;border-bottom:1px dashed var(--borda);display:flex;align-items:flex-start;gap:.5rem}
        .servico-detalhes li::before{content:'✓';color:var(--sucesso);font-weight:bold;flex-shrink:0}
        .servico-detalhes li:last-child{border-bottom:none}
        .tag-destaque{display:inline-block;background:linear-gradient(90deg,var(--secundario),var(--alerta));color:white;padding:.3rem .8rem;border-radius:50px;font-size:.8rem;font-weight:700;margin:.3rem .3rem .3rem 0}
        
        .garantia-box{background:linear-gradient(135deg,#E8F5E9,#C8E6C9);padding:3rem 2rem;border-radius:20px;text-align:center;margin:3rem 0;box-shadow:0 6px 20px rgba(46,125,50,.15)}
        .garantia-box h3{color:var(--sucesso);font-size:1.6rem;margin-bottom:1rem}
        .garantia-destaque{font-size:1.15rem;font-weight:700;color:var(--sucesso);margin-top:.8rem}
        
        .porque-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2rem;margin-top:2rem}
        .porque-item{display:flex;gap:1.2rem;align-items:flex-start;padding:1.5rem;background:white;border-radius:16px;box-shadow:var(--sombra);transition:.3s}
        .porque-item:hover{transform:translateY(-5px);box-shadow:var(--sombra-forte)}
        .porque-num{background:linear-gradient(135deg,var(--primario),var(--secundario));color:white;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;font-size:1.1rem}
        .porque-item h4{color:var(--primario);margin-bottom:.4rem}
        .porque-item p{color:var(--texto-claro);font-size:.95rem;line-height:1.6}
        
        .regioes-lista{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;margin-top:2rem}
        .regiao-tag{background:white;padding:1rem 1.6rem;border-radius:50px;box-shadow:var(--sombra);font-weight:600;transition:.3s;border:2px solid transparent}
        .regiao-tag:hover{transform:scale(1.08);border-color:var(--primario);background:var(--primario);color:white}
        
        .form-container{background:white;padding:2.5rem;border-radius:20px;box-shadow:var(--sombra-forte);max-width:560px;margin:0 auto}
        .form-grupo{margin-bottom:1.4rem}
        label{display:block;margin-bottom:.5rem;font-weight:600;color:var(--texto)}
        input,select,textarea{width:100%;padding:1rem 1.2rem;border:2px solid var(--borda);border-radius:12px;font-size:1rem;transition:.3s;background:#FAFCFD}
        input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primario);box-shadow:0 0 0 5px rgba(21,101,192,.1)}
        .erro-campo{border-color:var(--erro)!important;background:#FFEBEE}
        .texto-erro{color:var(--erro);font-size:.85rem;margin-top:.3rem;display:none}
        button[type="submit"]{width:100%;padding:1.1rem;background:linear-gradient(90deg,var(--primario),var(--primario-claro));color:white;border:none;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer;margin-top:.5rem;transition:.3s;box-shadow:0 4px 15px rgba(21,101,192,.3)}
        button[type="submit"]:hover{background:linear-gradient(90deg,var(--primario-escuro),var(--primario));transform:translateY(-2px)}
        button[type="submit"]:disabled{opacity:.7;cursor:not-allowed;transform:none}
        .mensagem{padding:1.2rem;border-radius:12px;margin-top:1.2rem;display:none;font-weight:600}
        .mensagem.sucesso{background:#E8F5E9;color:var(--sucesso);display:block;border-left:4px solid var(--sucesso)}
        .mensagem.erro{background:#FFEBEE;color:var(--erro);display:block;border-left:4px solid var(--erro)}
        
        .painel{display:none}
        .painel.ativo{display:block}
        .cabecalho-admin{display:flex;justify-content:space-between;align-items:center;margin-bottom:2.5rem;flex-wrap:wrap;gap:1rem;padding-bottom:1rem;border-bottom:2px solid var(--borda)}
        .aviso-permissao{background:#FFF3E0;color:#E65100;padding:1.5rem;border-radius:12px;text-align:center;margin-bottom:2rem;font-weight:600}
        .btn-sair{background:var(--erro);color:white;border:none;padding:.8rem 1.8rem;border-radius:10px;font-weight:700;cursor:pointer;transition:.3s}
        .btn-sair:hover{background:#B71C1C;transform:translateY(-2px)}
        .solicitacao-card{background:white;padding:1.8rem;border-radius:16px;box-shadow:var(--sombra);margin-bottom:1.2rem;border-left:5px solid var(--alerta);transition:.3s}
        .solicitacao-card:hover{box-shadow:var(--sombra-forte)}
        .status-pendente{border-left-color:var(--alerta)}
        .status-andamento{border-left-color:var(--primario)}
        .status-concluido{border-left-color:var(--sucesso)}
        .status-badge{display:inline-block;padding:.4rem 1rem;border-radius:50px;font-size:.85rem;font-weight:700;margin-top:.8rem}
        .badge-pendente{background:#FFF3E0;color:#E65100}
        .badge-andamento{background:#E3F2FD;color:#1565C0}
        .badge-concluido{background:#E8F5E9;color:#2E7D32}
        .select-status{margin-top:1rem;padding:.6rem 1rem;border-radius:8px;border:2px solid var(--borda);cursor:pointer;font-weight:600}
        
        .whatsapp-fixo{position:fixed;bottom:25px;right:20px;z-index:9999;background:#25D366;color:white;width:65px;height:65px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 6px 20px rgba(37,211,102,.4);transition:.3s;animation:pulsar-whatsapp 2s infinite}
        @keyframes pulsar-whatsapp{0%{box-shadow:0 0 0 0 rgba(37,211,102,.5)}70%{box-shadow:0 0 0 15px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
        .whatsapp-fixo:hover{transform:scale(1.15);animation:none}
        
        footer{background:#0F1E33;color:white;padding:3.5rem 1.5rem 2rem;margin-top:3rem}
        .rodape-container{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2.5rem}
        .rodape-col h3{margin-bottom:1.2rem;color:var(--secundario-claro);font-size:1.2rem}
        .rodape-col p{margin-bottom:.7rem;opacity:.85;line-height:1.7}
        .rodape-col a{color:var(--destaque);font-weight:600}
        .rodape-baixo{text-align:center;margin-top:2.5rem;padding-top:2rem;border-top:1px solid rgba(255,255,255,.1);opacity:.6;font-size:.9rem}
